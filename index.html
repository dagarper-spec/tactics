<body>
<canvas id="game"></canvas>
<div id="home">
  <h1>Tactics</h1>
  <p class="sub">El paso del río</p>
  <div class="menu">
    <button id="hCont" class="plank">Continuar</button>
    <button id="hNew" class="plank">Nueva partida</button>
    <button id="hBat" class="plank">Probar batalla</button>
  </div>
  <p id="hSave" class="dim"></p>
</div>
<div id="fade"></div>
<div id="top">
  <div class="panel" id="title">El paso del río · Hito 7</div>
  <div class="btns">
    <button id="rotL" title="Girar cámara (Q)" aria-label="Girar a la izquierda">&#8630;</button>
    <button id="rotR" title="Girar cámara (E)" aria-label="Girar a la derecha">&#8631;</button>
    <button id="cfgBtn" aria-label="Ajustes">&#9881;</button>
  </div>
  <div id="fps"></div>
</div>
<div class="panel" id="cfg" hidden>
  <button id="snd" aria-label="Sonido">&#9835; Sonido</button>
  <button id="qual">Calidad</button>
</div>
<div class="panel" id="queue"></div>
<div class="panel" id="end" hidden></div>
<div class="panel" id="dlg" hidden><canvas id="dlgPic" width="72" height="72"></canvas><div><div id="dlgName"></div><div id="dlgText"></div></div></div>
<div class="panel" id="hud">
  <div id="info">Toca una unidad para seleccionarla. Arrastra para mover la cámara; pellizca o usa la rueda para el zoom.</div>
  <div class="btns" id="actions"></div>
</div>
